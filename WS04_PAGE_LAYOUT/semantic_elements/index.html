<!doctype html>
<!-- Tells the browser this is an HTML5 document -->

<html lang="en">
  <!-- The root element that contains the entire web page -->

  <head>
    <!-- The head contains metadata (information about the page),
       not content that is shown on the page -->

    <meta charset="UTF-8" />
    <!-- Sets character encoding so text displays correctly -->

    <title>My Website</title>
    <!-- The title shown in the browser tab -->
  </head>

  <body>
    <!-- The body contains all content that is visible on the page -->

    <header>
      <!-- The header is used for introductory content.
         It usually appears at the top of the page and often
         contains the site title and navigation. -->

      <h1>My Website</h1>

      <nav>
        <!-- The nav element contains navigation links.
           It helps users and screen readers understand
           where the navigation of the site is. -->

        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- The main element contains the main content of the page.
         There should only be one main element per page. -->

      <section id="about">
        <!-- A section groups related content together.
           It makes the page structure clearer and more semantic. -->

        <h2>About Me</h2>
        <p>This is a paragraph about me.</p>
      </section>
    </main>

    <footer>
      <!-- The footer appears at the bottom of the page.
         It usually contains copyright information,
         contact details, or legal text.
         That is why it is placed at the end. -->

      <p>Copyright 2025</p>
    </footer>
  </body>
</html>
